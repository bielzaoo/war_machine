[window]
padding = { x = 8, y = 8 }
opacity = 1.0
dynamic_title = true

[scrolling]
history = 10000

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#000000"
foreground = "#c8d3d5"

[colors.cursor]
text   = "#000000"
cursor = "#00f0ff"

[colors.selection]
text       = "#000000"
background = "#00f0ff"

[colors.normal]
black   = "#0a0a0a"
red     = "#ff3b5c"
green   = "#00d98b"
yellow  = "#00b8c4"
blue    = "#0091ff"
magenta = "#7b5cff"
cyan    = "#00f0ff"
white   = "#c8d3d5"

[colors.bright]
black   = "#2a2a2a"
red     = "#ff6b85"
green   = "#3affb0"
yellow  = "#3ae0eb"
blue    = "#3aa8ff"
magenta = "#a58cff"
cyan    = "#5cf7ff"
white   = "#ffffff"
