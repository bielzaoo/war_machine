set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "config recarregado"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- vanta black + cyan ---
set -g status-position bottom
set -g status-style "bg=#000000,fg=#c8d3d5"
set -g status-left "#[fg=#000000,bg=#00f0ff,bold] #S #[default] "
set -g status-right "#[fg=#00f0ff]%H:%M #[fg=#5a6567]| #[fg=#c8d3d5]#h "
set -g status-left-length 30
set -g status-right-length 40

setw -g window-status-current-style "fg=#00f0ff,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#5a6567"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#00f0ff"
set -g message-style "bg=#00f0ff,fg=#000000,bold"
