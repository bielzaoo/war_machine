# =====================================================================
#  tmux - war_machine
#  Keybinds iguais aos do host (dotfiles, esquema Omarchy): Ctrl+Alt+setas
#  pros paineis, Alt+numero e Alt+setas pras janelas, sem prefix pro que e
#  usado toda hora. Tema vanta black + cyan. Clipboard via xclip (X11).
#
#  Log de evidencia: painel aberto dentro de ~/engagements/<alvo> grava
#  sozinho em <alvo>/logs/ (ver engage). prefix L liga/desliga na mao.
#  O status mostra REC no painel que esta gravando.
# =====================================================================

# --- Prefix: Ctrl+Space, Ctrl+a continua valendo ---
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix

#: prefix d | Soltar a sessao (a sessao segue rodando)
#: prefix z | Maximizar/voltar o painel
#: prefix [ | Copy mode (v seleciona, y copia pro clipboard)
#: prefix ? | Todos os atalhos, inclusive os padroes

bind -N "Recarregar a config" q source-file ~/.tmux.conf \; display "Config recarregada"

# --- Paineis ---
# h = um embaixo do outro, v = lado a lado
bind -N "Dividir: um embaixo do outro" h split-window -v -c "#{pane_current_path}"
bind -N "Dividir: lado a lado" v split-window -h -c "#{pane_current_path}"
bind -N "Fechar painel" x kill-pane

# Ctrl+Alt+setas: muda de painel; com Shift: redimensiona
bind -N "Painel a esquerda (Ctrl+Alt+setas)" -n C-M-Left select-pane -L
bind -N "Painel a direita" -n C-M-Right select-pane -R
bind -N "Painel de cima" -n C-M-Up select-pane -U
bind -N "Painel de baixo" -n C-M-Down select-pane -D

bind -N "Redimensionar painel (Ctrl+Alt+Shift+setas)" -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# --- Janelas ---
bind -N "Renomear janela" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Nova janela (mesma pasta)" c new-window -c "#{pane_current_path}"
bind -N "Fechar janela" k kill-window

bind -N "Ir pra janela N (Alt+1..9)" -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -N "Janela anterior" -n M-Left select-window -t -1
bind -N "Proxima janela" -n M-Right select-window -t +1
bind -N "Mover janela pra esquerda" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Mover janela pra direita" -n M-S-Right swap-window -t +1 \; select-window -t +1

# --- Sessoes ---
bind -N "Renomear sessao" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Nova sessao (mesma pasta)" C new-session -c "#{pane_current_path}"
bind -N "Fechar sessao" K kill-session
bind P switch-client -p
bind N switch-client -n

bind -N "Sessao anterior" -n M-Up switch-client -p
bind -N "Proxima sessao" -n M-Down switch-client -n

# --- Sessionizer: prefix f escolhe uma pasta do zoxide e entra na sessao dela ---
bind -N "Sessionizer: pasta do zoxide vira sessao" f display-popup -E -w 60% -h 50% "~/.local/bin/sessao"

# --- Log de evidencia ---
bind -N "Log do painel: liga/desliga" L run-shell "~/.config/scripts/tmux-log.sh toggle '#{pane_id}'"
set-hook -g after-new-session  'run-shell "~/.config/scripts/tmux-log.sh auto #{pane_id}"'
set-hook -g after-new-window   'run-shell "~/.config/scripts/tmux-log.sh auto #{pane_id}"'
set-hook -g after-split-window 'run-shell "~/.config/scripts/tmux-log.sh auto #{pane_id}"'

# --- Copy mode estilo vi (v seleciona, y copia pro clipboard do X) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# --- Geral ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB,xterm-kitty:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g aggressive-resize on
# Fechar a ultima janela de uma sessao pula pra outra sessao em vez de sair
set -g detach-on-destroy off

# Nome da janela = pasta atual
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# --- Tema: vanta black + cyan ---
# bg #000000  fg #c8d3d5  accent #00f0ff  inactive #1a1a1a  dim #5a6567
# accent escuro #00b8c4  atencao #ffb800  erro #ff3b5c
set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#00f0ff"
set -g popup-border-style "fg=#00f0ff"
set -g popup-border-lines single
set -g message-style "fg=#000000,bg=#00f0ff,bold"
set -g message-command-style "fg=#00f0ff,bg=#000000"
set -g mode-style "fg=#000000,bg=#00b8c4"
set -g clock-mode-colour "#00f0ff"
set -g clock-mode-style 24
set -g display-panes-active-colour "#00f0ff"
set -g display-panes-colour "#5a6567"

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#c8d3d5,bg=#000000"
set -g status-left-length 40
set -g status-right-length 100

# Sessao em cyan escuro; no prefix acende. Copy mode ganha bloco amarelo.
set -g status-left "#{?client_prefix,#[fg=#000000 bg=#00f0ff bold],#[fg=#000000 bg=#00b8c4]} #S #[default]#{?pane_in_mode,#[fg=#000000 bg=#ffb800] #{pane_mode} #[default],} "

set -g window-status-separator " "
set -g window-status-current-format "#[fg=#000000,bg=#00f0ff,bold] #I #[fg=#000000,bg=#c8d3d5,nobold] #W#{?window_zoomed_flag, [z],} #[default]"
set -g window-status-format "#[fg=#00b8c4] #I #[fg=#5a6567]#W#{?window_zoomed_flag, [z],}#{?window_last_flag, -,} #[default]"
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#ffb800"
set -g window-status-bell-style "fg=#ff3b5c,bold"

# Direita: REC se o painel grava, pasta (~ no lugar do $HOME), branch git
set -g @home "$HOME"
set -g status-right "#{?pane_pipe,#[fg=#000000 bg=#ff3b5c bold] REC #[default] ,}#[fg=#5a6567]#{s|^#{@home}|~|:pane_current_path}#[fg=#00b8c4]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/#/##/g; s/^/  /') "
