# =====================================================================
#  kitty - terminal "vidro" sem compositor
#  Paleta: vanta black + cyan (#00f0ff)
#
#  O background_image NAO e definido aqui: o ~/.config/scripts/term.sh passa
#  o fundo desfocado gerado pelo wallpaper.sh (-o background_image=...).
#  Abrir o kitty direto, sem o script, da fundo preto solido.
# =====================================================================

# --- Fonte ------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Janela -----------------------------------------------------------
window_padding_width     8
hide_window_decorations  yes
confirm_os_window_close  0
linux_display_server     x11

# --- Fundo ------------------------------------------------------------
background_image_layout  cscaled
background_image_linear  yes

# --- Desempenho em VM sem GPU (llvmpipe) -------------------------------
# Cada frame e renderizado na CPU; o objetivo e redesenhar pouco.
sync_to_monitor          no
repaint_delay            10
input_delay              3
cursor_blink_interval    0
enable_audio_bell        no
scrollback_lines         10000

# --- Seguranca / ruido ------------------------------------------------
allow_remote_control     no
update_check_interval    0
# xterm-kitty nao existe nos alvos: ssh/nc/shells reversos quebram sem isto
term                     xterm-256color

# --- Cores ------------------------------------------------------------
foreground            #c8d3d5
background            #000000
cursor                #00f0ff
cursor_text_color     #000000
selection_foreground  #000000
selection_background  #00f0ff
url_color             #00f0ff

color0   #0a0a0a
color1   #ff3b5c
color2   #00d98b
color3   #00b8c4
color4   #0091ff
color5   #7b5cff
color6   #00f0ff
color7   #c8d3d5

color8   #2a2a2a
color9   #ff6b85
color10  #3affb0
color11  #3ae0eb
color12  #3aa8ff
color13  #a58cff
color14  #5cf7ff
color15  #ffffff
